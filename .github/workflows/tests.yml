name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[owner]"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHON=python bash tests/test_smoke.sh
      - run: ytclaw --db "$RUNNER_TEMP/sample.sqlite" demo
      - run: ytclaw --db "$RUNNER_TEMP/sample.sqlite" report

[project]
name = "ytclaw"
version = "0.3.0"
description = "Local SQLite memory for a YouTube channel: videos, stats history, comments, transcripts, full-text search. Zero-cost reads."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["youtube-transcript-api>=1.0", "pyyaml>=6"]

[project.optional-dependencies]
owner = ["google-auth-oauthlib>=1.2"]

[project.scripts]
ytclaw = "ytclaw:main"

[project.urls]
Homepage = "https://github.com/ravsau/ytclaw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ytclaw.py", "ytclaw_ops.py", "ytclaw_reports.py", "ytclaw_analytics.py", "ytclaw_demo.py", "ytclaw_web.py", "web", "skills"]
